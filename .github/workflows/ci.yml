# Continuous integration: run the engine unit tests on every push / PR.
# The tests need nothing but Node (preinstalled on the runner): they pull
# the inline <script> out of index.html and exercise the chess rules.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Engine tests
        run: node tests/engine.test.js
